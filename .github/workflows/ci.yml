name: LedgerOne Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Backend Static Analysis & Code Quality
  # ============================================================================
  backend-lint-and-audit:
    name: Backend Code Integrity & Linter Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linter & Quality Checkers
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Static & Syntax Check
        run: |
          ruff check src tests --select E9,F63,F7,F82

  # ============================================================================
  # JOB 2: Backend Integration & Invariant Test Suite
  # ============================================================================
  backend-tests:
    name: Backend Verification & Invariant Hierarchy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils libgl1

      - name: Install Python Dependencies (CPU PyTorch + Requirements)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Master End-to-End Production Integration Suite (All 8 Scenarios)
        run: |
          python -m pytest tests/test_e2e_production_integration.py -v

      - name: Run Evidence-Grounded RAG & Citation Evaluation Suite
        run: |
          python -m pytest tests/test_rag_eval.py -v

      - name: Run Zero-Drift Financial Normalizer & Invariant Suite
        run: |
          python -m pytest tests/test_financial_normalizer.py tests/test_document_validation.py -v

      - name: Run Benchmark Evidence & Anti-Cheating Invariant Suite
        run: |
          python -m pytest tests/test_benchmark_evidence.py -v

  # ============================================================================
  # JOB 3: Frontend TypeScript Strict Compilation & Asset Bundling
  # ============================================================================
  frontend-build:
    name: Frontend Build & Typecheck (React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Run TypeScript Strict Typecheck
        run: |
          npm run typecheck

      - name: Build Production Bundle (Vite)
        run: |
          npm run build

  # ============================================================================
  # JOB 4: Container Build & Multi-Stage Image Validation
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ledgerone-frontend:ci

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ledgerone-backend:ci
